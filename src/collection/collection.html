<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EggGacha Collection</title>


    <!-- Global EggGacha colours -->

    <link
        rel="stylesheet"
        href="/styles/theme.css"
    >


    <!-- Collection specific styling -->

    <link
        rel="stylesheet"
        href="/collection-files/collection.css"
    >

</head>


<body>

<main class="page">


    <!-- ==================================================
         Header
         ================================================== -->

    <header class="page-header">

        <div class="page-logo">
            🥚
        </div>

        <h1 id="title">
            Egg Collection
        </h1>

        <div class="subtitle">
            EggGacha Collection
        </div>

    </header>


    <!-- ==================================================
         Global collection statistics
         ================================================== -->

    <section class="stats">

        <div class="stat">

            <span
                id="total-eggs"
                class="stat-value"
            >
                0
            </span>

            <span class="stat-label">
                Total Eggs
            </span>

        </div>


        <div class="stat">

            <span
                id="unique-eggs"
                class="stat-value"
            >
                0 / 0
            </span>

            <span class="stat-label">
                Discovered
            </span>

        </div>


        <div class="stat">

            <span
                id="completion"
                class="stat-value"
            >
                0%
            </span>

            <span class="stat-label">
                Completion
            </span>

        </div>

    </section>


    <!-- ==================================================
         Overall collection progress
         ================================================== -->

    <section class="progress-container">

        <div class="progress-info">

            <span>
                Collection Progress
            </span>

            <span id="progress-text">
                0 / 0
            </span>

        </div>


        <div class="progress-bar">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>

    </section>


    <!-- ==================================================
         Rarity sections generated by collection.js
         ================================================== -->

    <section
        id="rarity-sections"
        class="rarity-sections"
    ></section>


</main>


<script src="/collection-files/collection.js"></script>

</body>

</html>
