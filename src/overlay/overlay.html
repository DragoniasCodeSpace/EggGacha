<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EggGacha Overlay</title>

    <!-- Global EggGacha theme -->
    <link
        rel="stylesheet"
        href="/styles/theme.css"
    >

    <!-- Overlay-specific styling -->
    <link
        rel="stylesheet"
        href="/overlay-files/overlay.css"
    >
</head>

<body>

<div id="overlay">

    <div id="username"></div>

    <div class="egg-container">

        <div id="flash"></div>

        <div id="egg-placeholder">
            🥚
        </div>

        <img
            id="egg-image"
            alt="Rolled egg"
        >

    </div>

    <div id="egg-name"></div>

    <div id="rarity"></div>

    <div id="collection-status"></div>

</div>

<script>
    const overlay =
        document.getElementById(
            "overlay"
        );

    const username =
        document.getElementById(
            "username"
        );

    const eggPlaceholder =
        document.getElementById(
            "egg-placeholder"
        );

    const eggImage =
        document.getElementById(
            "egg-image"
        );

    const eggName =
        document.getElementById(
            "egg-name"
        );

    const rarity =
        document.getElementById(
            "rarity"
        );

    const collectionStatus =
        document.getElementById(
            "collection-status"
        );

    const flash =
        document.getElementById(
            "flash"
        );


    // =====================================================
    // Roll queue
    // =====================================================

    const queue = [];

    let playing = false;


    // =====================================================
    // WebSocket
    // =====================================================

    const protocol =
        window.location.protocol === "https:"
            ? "wss:"
            : "ws:";

    const socket =
        new WebSocket(
            `${protocol}//${window.location.host}`
        );


    socket.addEventListener(
        "open",
        () => {

            console.log(
                "EggGacha overlay connected."
            );

        }
    );


    socket.addEventListener(
        "message",
        event => {

            const message =
                JSON.parse(
                    event.data
                );


            if (
                message.type !==
                "egg_roll"
            ) {
                return;
            }


            queue.push(
                message
            );


            playNext();

        }
    );


    socket.addEventListener(
        "close",
        () => {

            console.log(
                "EggGacha overlay disconnected."
            );

        }
    );


    // =====================================================
    // Queue
    // =====================================================

    async function playNext() {

        if (playing) {
            return;
        }


        const message =
            queue.shift();


        if (!message) {
            return;
        }


        playing = true;


        await playRoll(
            message
        );


        playing = false;


        playNext();

    }


    // =====================================================
    // Play egg roll
    // =====================================================

    async function playRoll(message) {

        resetOverlay();


        const rolledRarity =
            message.egg.rarity;


        overlay.classList.add(
            rolledRarity
        );


        username.textContent =
            message.user.displayName;


        eggName.textContent =
            message.egg.name;


        rarity.textContent =
            rolledRarity;


        if (
            message.collection.isNew
        ) {

            collectionStatus.textContent =
                "NEW!";

            collectionStatus.classList.add(
                "new"
            );

        } else {

            collectionStatus.textContent =
                `Owned ×${message.collection.quantity}`;

        }


        if (
            message.egg.image
        ) {

            eggImage.src =
                message.egg.image;

        }


        overlay.classList.add(
            "visible"
        );


        eggPlaceholder.classList.add(
            "shake"
        );


        const timings =
            getRarityTimings(
                rolledRarity
            );


        await wait(
            timings.shake
        );


        eggPlaceholder.classList.remove(
            "shake"
        );


        eggPlaceholder.style.opacity =
            "0";


        flash.classList.add(
            "flash"
        );


        eggImage.classList.add(
            "reveal"
        );


        await wait(750);


        addRarityAnimation(
            rolledRarity
        );


        await wait(
            timings.display
        );


        overlay.classList.remove(
            "visible"
        );


        await wait(400);


        resetOverlay();

    }


    // =====================================================
    // Rarity animations
    // =====================================================

    function addRarityAnimation(
        rolledRarity
    ) {

        if (
            rolledRarity ===
            "legendary"
        ) {

            eggImage.classList.add(
                "float"
            );

        }


        if (
            rolledRarity ===
            "exotic"
        ) {

            eggImage.classList.add(
                "float"
            );

        }


        if (
            rolledRarity ===
            "mythic"
        ) {

            eggImage.classList.add(
                "mythic-pulse"
            );

        }


        if (
            rolledRarity ===
            "ancient"
        ) {

            eggImage.classList.add(
                "ancient-pulse"
            );

        }


        if (
            rolledRarity ===
            "eternal"
        ) {

            eggImage.classList.add(
                "eternal-pulse"
            );

        }

    }


    // =====================================================
    // Rarity timings
    // =====================================================

    function getRarityTimings(
        rolledRarity
    ) {

        const timings = {

            common: {
                shake: 900,
                display: 2200
            },

            uncommon: {
                shake: 1100,
                display: 2400
            },

            rare: {
                shake: 1300,
                display: 2800
            },

            epic: {
                shake: 1550,
                display: 3100
            },

            legendary: {
                shake: 1850,
                display: 3600
            },

            exotic: {
                shake: 2100,
                display: 3900
            },

            mythic: {
                shake: 2500,
                display: 4400
            },

            ancient: {
                shake: 2900,
                display: 4900
            },

            eternal: {
                shake: 3500,
                display: 5600
            }

        };


        return (
            timings[rolledRarity] ??
            timings.common
        );

    }


    // =====================================================
    // Reset overlay
    // =====================================================

    function resetOverlay() {

        overlay.className =
            "";


        eggPlaceholder.className =
            "";

        eggPlaceholder.style.opacity =
            "1";


        eggImage.className =
            "";

        eggImage.removeAttribute(
            "src"
        );


        flash.className =
            "";


        collectionStatus.className =
            "";


        username.textContent =
            "";

        eggName.textContent =
            "";

        rarity.textContent =
            "";

        collectionStatus.textContent =
            "";

    }


    // =====================================================
    // Utility
    // =====================================================

    function wait(milliseconds) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    milliseconds
                )
        );

    }
</script>

</body>

</html>
